<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Trade Directory</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin:0; padding:0; height:100vh; overflow:hidden; font:14px/1.5 system-ui,sans-serif; color:#333; }
  body { display: grid; grid-template-columns: 350px 1fr; }
  
  .sidebar { background:#f9f9f9; border-right:1px solid #ddd; padding:24px; display:flex; flex-direction:column; gap:16px; overflow-y: auto; }
  h2 { margin:0; font-size:20px; }
  .badge { background:#eef2f5; color:#333; font-size:12px; padding:4px 8px; border-radius:12px; font-weight:normal; display:inline-block; }
  
  #chat { display:flex; flex-direction:column; gap:8px; }
  #chat input { padding:10px; border:1px solid #ccc; border-radius:4px; }
  #ask { background:#000; color:#fff; padding:10px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
  #answer { background:#eef2f5; padding:12px; border-radius:6px; white-space:pre-wrap; display:none; font-size:13px; }

  .role-filter { display:flex; flex-direction:column; gap:8px; margin-top:8px; border-top:1px solid #eee; padding-top:16px;}
  .role-filter select { padding:10px; border:1px solid #ccc; border-radius:4px; font-size:14px; width:100%; }
  .role-filter button { background:#fff; color:#333; border:1px solid #ccc; padding:10px; border-radius:4px; cursor:pointer; font-weight:bold;}
  .role-filter button:hover { background:#f0f0f0; }

  .main-content { display: grid; grid-template-rows: minmax(0, 1fr) 400px; height: 100vh; min-width: 0; }
  #map { width: 100%; height: 100%; background:#e5e5e5; z-index: 1; }
  .table-container { overflow-y: auto; scrollbar-gutter: stable; background: #fff; border-top: 2px solid #ccc; padding: 16px; box-sizing: border-box; z-index: 2; }
  
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #eee; font-size:13px; }
  th { background:#f4f4f4; position:sticky; top:0; }
  .source-badge { background:#e0e7ff; color:#3730a3; font-size:10px; padding:2px 6px; border-radius:4px; text-transform:uppercase; font-weight:bold; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Global Trade <span id="total-count" class="badge">Loading...</span></h2>
  
  <div id="chat">
    <p style="margin:0;font-size:12px;color:#666;">Ask AI to filter:</p>
    <input id="q" placeholder="e.g. machinery importers in ZA">
    <button id="ask">Ask AI</button>
  </div>
  <div id="answer"></div>

  <div class="role-filter">
    <p style="margin:0;font-size:12px;color:#666;">Filter by Role:</p>
    <select id="f-role">
      <option value="">All Roles</option>
      <option value="Importer">Importers</option>
      <option value="Exporter">Exporters</option>
      <option value="Importer/Exporter">Importers & Exporters</option>
      <option value="Distributor">Distributors</option>
      <option value="Logistics/Forwarder">Logistics / Forwarders</option>
    </select>
    <button id="apply-filter">Apply Filter</button>
  </div>

  <div style="margin-top:auto;font-size:12px;color:#888;">
    <p><strong>Instructions:</strong></p>
    <p>Click on any country on the map to instantly view its registered importers and exporters.</p>
  </div>
</div>

<div class="main-content">
  <div id="map"></div>
  <div class="table-container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="country-title" style="margin:0;">Global View</h3>
      <button id="reset-btn" style="padding:6px 12px;cursor:pointer;">Reset View</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Source</th><th>Role</th><th>Country</th><th>Website</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=33"></script>
</body>
</html>
