<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Directory</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:24px;max-width:1200px;margin:0 auto;color:#333;}
  h2{margin-top:0;display:flex;align-items:center;gap:12px;}
  .badge{background:#eef2f5;color:#333;font-size:12px;padding:4px 8px;border-radius:12px;font-weight:normal;}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #eee;font-size:13px}
  input,select,button{padding:8px 12px;margin-right:8px;border:1px solid #ccc;border-radius:4px;}
  button{background:#000;color:#fff;border:none;cursor:pointer;font-weight:600;}
  button:hover{background:#333;}
  #chat{display:flex;gap:8px;margin:24px 0;background:#f9f9f9;padding:16px;border-radius:8px;border:1px solid #eee;}
  #chat input{flex:1;}
  #answer{background:#eef2f5;padding:16px;border-radius:6px;white-space:pre-wrap;margin-bottom:24px;display:none;}
  .verified{color:#0a7d32;font-weight:600}
  .probable{color:#8a6d00}
  .shell_risk{color:#b00020}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;padding:12px 0;}
</style>
</head>
<body>
<h2>Trade Directory <span id="total-count" class="badge">Loading...</span></h2>

<div id="chat">
  <input id="q" placeholder="Ask AI: e.g. machinery manufacturers in India or fresh produce exporters from ZA">
  <button id="ask">Ask AI</button>
</div>
<div id="answer"></div>

<div class="filters">
  <select id="f-country">
    <option value="">All countries</option>
    <option value="ZA">South Africa (ZA)</option>
    <option value="US">United States (US)</option>
    <option value="IN">India (IN)</option>
  </select>
  <select id="f-sector">
    <option value="">All sectors</option>
    <option value="Fresh Produce">Fresh Produce</option>
    <option value="Agriculture & Commodities">Agriculture & Commodities</option>
    <option value="Machinery & Equipment">Machinery & Equipment</option>
    <option value="Metals & Steel">Metals & Steel</option>
    <option value="Chemicals">Chemicals</option>
    <option value="Pharmaceuticals">Pharmaceuticals</option>
    <option value="Automotive">Automotive</option>
    <option value="Logistics & Transport">Logistics & Transport</option>
  </select>
  <select id="f-role">
    <option value="">All trade roles</option>
    <option value="Importer">Importer</option>
    <option value="Exporter">Exporter</option>
    <option value="Distributor">Distributor</option>
    <option value="Manufacturer">Manufacturer</option>
    <option value="Logistics">Logistics/Forwarder</option>
  </select>
  <input id="f-hs" placeholder="HS-2 e.g. 84" size="8">
  <button id="go">Filter</button>
</div>

<table>
  <thead>
    <tr><th>Name</th><th>Role</th><th>Sector</th><th>Country</th><th>Website</th><th>Email</th></tr>
  </thead>
  <tbody id="rows">
    <tr><td colspan="6" style="text-align:center;color:#999;">Loading...</td></tr>
  </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=8"></script>
</body>
</html>
