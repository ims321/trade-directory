<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Trade Directory</title>
<!-- Leaflet Map CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:0;color:#333;display:flex;height:100vh;}
  
  /* Left Sidebar for AI and Info */
  .sidebar{width:350px;background:#f9f9f9;border-right:1px solid #ddd;padding:24px;display:flex;flex-direction:column;gap:16px;}
  h2{margin:0;font-size:20px;}
  .badge{background:#eef2f5;color:#333;font-size:12px;padding:4px 8px;border-radius:12px;font-weight:normal;display:inline-block;}
  
  /* AI Chat */
  #chat{display:flex;flex-direction:column;gap:8px;}
  #chat input{padding:10px;border:1px solid #ccc;border-radius:4px;}
  #ask{background:#000;color:#fff;padding:10px;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
  #answer{background:#eef2f5;padding:12px;border-radius:6px;white-space:pre-wrap;display:none;font-size:13px;}

  /* Right Content Area for Map and Table */
  .main-content{flex:1;display:flex;flex-direction:column;}
  #map{flex:1;width:100%;background:#e5e5e5;}
  
  /* Table Container */
  .table-container{height:40%;overflow-y:auto;background:#fff;border-top:2px solid #ccc;padding:16px;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #eee;font-size:13px;}
  th{background:#f4f4f4;position:sticky;top:0;}
  .source-badge{background:#e0e7ff;color:#3730a3;font-size:10px;padding:2px 6px;border-radius:4px;text-transform:uppercase;font-weight:bold;}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Global Trade <span id="total-count" class="badge">Loading...</span></h2>
  
  <div id="chat">
    <p style="margin:0;font-size:12px;color:#666;">Ask AI to filter companies globally:</p>
    <input id="q" placeholder="e.g. machinery importers in ZA">
    <button id="ask">Ask AI</button>
  </div>
  <div id="answer"></div>
  
  <div style="margin-top:auto;font-size:12px;color:#888;">
    <p><strong>Instructions:</strong></p>
    <p>Click on any country on the map to instantly view its registered importers and exporters.</p>
  </div>
</div>

<!-- Map and Table -->
<div class="main-content">
  <div id="map"></div>
  <div class="table-container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="country-title" style="margin:0;">Select a country on the map</h3>
      <button onclick="loadCompanies(null)" style="padding:6px 12px;cursor:pointer;">Show All Countries</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Source</th><th>Role</th><th>Country</th><th>Website</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Leaflet Map JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20"></script>
</body>
</html>
